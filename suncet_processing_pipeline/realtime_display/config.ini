[tcp]
mode = client
host = 10.247.13.32
port = 54000
reconnect = true
reconnect_seconds = 2.0
# Reconnect when a socket stays open but no bytes arrive for this long.
idle_reconnect_seconds = 15.0
read_bytes = 4096

[pipeline]
# Path to the normal SunCET processing config. Relative paths are resolved from
# this realtime-display config file.
processing_config = ../config_files/config_default.ini

[framing]
byte_order = big
allow_ccsds_asm = true
ccsds_asm = 0x1ACFFC1D
# The current TCP tap prepends a 16-byte ground frame prefix before each
# standard CCSDS packet.
allow_frame_prefix = true
frame_prefix = 0x1BADCafe
frame_prefix_bytes = 16
allow_ax25_header = false
allow_missing_ax25_header = true
ax25_destination = SUN1
ax25_source = LASP
ax25_ctrl = 0x03
ax25_pid = 0xF0
segmentation_enabled = false
segmented_packet_threshold_bytes = 244
max_segment_payload_bytes = 244
segment_flag_start = 1
segment_flag_middle = 0
segment_flag_end = 2
max_packet_bytes = 65535
max_buffer_bytes = 1048576

[decode]
require_packet_checksums = false
drop_failed_checksums = false
ignored_apids =
    3
    6
    8
    11
    14
    15
    19
    20
    27
    49
    57
    515
    518
    520
    523
    526
    527
    532
    539
ignored_packet_name_patterns =
    *des*
    *mem*
    *log*
    *tbl*
    ana_hk

[limits]
color_limits_xml = color_limits_tlm.xml

[time]
# FSW J2000 seconds are interpreted as seconds since this UTC epoch, with the
# post-J2000 leap-second correction below applied before display.
j2000_epoch_utc = 2000-01-01T00:00:00Z
add_post_j2000_leap_seconds = true
# Ignore combined secondary-header J2000 times earlier than this for plots and
# top-left Onboard UTC. 700000000 is 2022-03-04T20:26:45Z after leap correction.
min_valid_j2000_seconds = 700000000.0
# Reject selected plot points when a packet's x-axis time jumps farther than
# this cushion plus wall-clock elapsed * max_plot_time_wall_rate. Set the jump
# to 0 or less to disable this filter.
max_plot_time_jump_seconds = 300.0
max_plot_time_wall_rate = 5.0

[value_filter]
# Drop plot values that are far outside each field's recent accepted history.
enabled = false
sigma_threshold = 3.0
min_samples = 12
window_points = 50
# Floors keep nearly-flat telemetry from rejecting small real changes forever.
std_floor = 0.05
relative_std_floor = 0.01

[display]
host = 127.0.0.1
port = 8050
history_points = 300
stale_after_seconds = 10.0
sse_heartbeat_seconds = 15.0

[telemetry]
# Empty packet_name_patterns means "search every decoded packet".
packet_name_patterns =
field_patterns =
    *temp*
    *temperature*
    csie_det0_therm
    csie_det1_therm
    *bat*v*
    *batt*v*
    *battery*v*
    *bus*v*
    *bus*volt*
    *volt*
    *_v
    *curr*
    *current*
    *bus*i*
    *_i
excluded_field_patterns =
    *sa_minus_y_temp*
    *sa_plus_y_temp*
    *1p0*
    *1p8*
    *3p3*
    csie_curr_det
    csie_curr_inst
    csie_curr_peak_util
    csie_curr_util
    csie_volt_1p5
    csie_volt_2p5
    csie_volt_adc_buff
    csie_volt_det
    csie_volt_util
