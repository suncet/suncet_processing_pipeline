# Copy to $HOME/.config/suncet/rclone_public.ini, replace placeholders, and chmod 600.
[rclone]
config = /ABSOLUTE/PATH/TO/rclone.conf
executable = /ABSOLUTE/PATH/TO/rclone
transfers = 4
checkers = 8
timeout_seconds = 21600
state_directory = /ABSOLUTE/PRIVATE/STATE/PATH/suncet/rclone

[task:pull-reference]
direction = pull
remote = SUNCET_PUBLIC_REMOTE:PUBLIC_DATA_ROOT
local = .
filter_file = /ABSOLUTE/PATH/TO/suncet_processing_pipeline/operations/rclone/pull_reference.filter

[task:push-products]
direction = push
remote = SUNCET_PUBLIC_REMOTE:PUBLIC_DATA_ROOT
local = .
filter_file = /ABSOLUTE/PATH/TO/suncet_processing_pipeline/operations/rclone/push_products.filter
