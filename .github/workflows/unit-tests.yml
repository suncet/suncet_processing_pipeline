name: Test Suncet Data Processing Pipeline

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Build and validate installed package
        run: |
          mkdir -p "${RUNNER_TEMP}/suncet-wheel"
          python -m pip wheel --no-deps --wheel-dir "${RUNNER_TEMP}/suncet-wheel" .
          python -m pip install --no-deps --force-reinstall "${RUNNER_TEMP}"/suncet-wheel/*.whl
          cd "${RUNNER_TEMP}"
          python - <<'PY'
          from importlib.resources import files

          root = files("suncet_processing_pipeline")
          expected = (
              root / "config_files" / "config_default.ini",
              root / "config_files" / "cme_tracking_reference_v0.json",
              root / "satnogs" / "suncet_apid1.ksy",
          )
          assert all(path.is_file() for path in expected)
          PY
      - name: Run Unit Tests
        run: python -m pytest -v
