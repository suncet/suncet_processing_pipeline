# IMPORTANT: suncet_data must be an absolute path to the root of the standard
# SunCET data tree. All relative paths below are resolved from that root.

[behavior]
# Boolean flag to make level 0.5
make_level0_5 = True
# Boolean flag to make level 1
make_level1 = True
# Boolean flag to make level 2
make_level2 = True
# Boolean flag to make level 3
make_level3 = True
# Boolean flag to make level 5
make_level4 = True
# If True, Level 0.5 discovery skips Hydra realtime files (basename prefix ccsds_)
ignore_realtime = False
# If True, write a PNG preview (inferno) next to FITS under level0_5/.
save_png = True
# If True, write a JPEG2000 (.jp2) preview (same scaling/colormap as PNG; for Helioviewer/JHelioviewer)
save_jpeg2000 = False
# If True, write decoded CSIE_META fields next to each saved image as image_<id><suffix>_meta.json under level0_5/, in addition to meta being saved in the FITS file header
also_save_csie_meta_json = True

[limits]
# [units] example
example_limit = [170, 210]

[paths]
# Path to data to process, relative to suncet_data. An explicit absolute path is
# accepted for one-off external inputs.
data_to_process_path = test_data/2026-05-20_xband_downlink_hk_sci_dsps_adcs
# CTDBs are private and separate from suncet_data. suncet_ctdb must point to
# their host-specific root (for example, the Box-backed folder on the Mac).
ctdb_base = ${suncet_ctdb}

[structure]
# Pipeline version number (semantic format) used for output filenames and metadata produced by this repo.
version_pipeline = 2.0.0
# Bus CTDB version number (semantic format) used only to locate the bus CTDB under ctdb_base.
version_bus = 2.0.1
# CSIE CTDB version number (semantic format) used only to locate the CSIE CTDB under ctdb_base.
version_csie = 1.1.2
# The 'vanilla' metadata file for the mission, relevant parameters will be overwritten for output files
base_metadata_filename = suncet_metadata_definition_v1.0.2dev-FITS.csv
# Optional suffix for output filenames (e.g. test_phase -> -test_phase before extension). Leave empty for no suffix.
output_suffix = hardline_playback_test

[calibration]
# calibration definitions, paths, and filenames, should be modified as definitions are updated
calibration_path = calibration

dark_filename = dark_filename.fits
flat_filename = flat_filename.fits
badpix_filename = badpix_filename.fits

cosmic_ray_removal = True
