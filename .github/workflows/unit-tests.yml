name: Test Suncet Data Processing Pipeline

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Verify generated public decoder with Kaitai 0.11
        run: |
          curl --fail --location --retry 3 https://github.com/kaitai-io/kaitai_struct_compiler/releases/download/0.11/kaitai-struct-compiler-0.11.zip -o "${RUNNER_TEMP}/kaitai.zip"
          echo "ff89389d9dc9e770d78a24af328763cb1f8e7b31ce7766c9edf10669a060f2a2  ${RUNNER_TEMP}/kaitai.zip" | sha256sum --check
          unzip -q "${RUNNER_TEMP}/kaitai.zip" -d "${RUNNER_TEMP}/kaitai"
          python -m suncet_processing_pipeline.satnogs.build_decoder --check --compiler "${RUNNER_TEMP}/kaitai/kaitai-struct-compiler-0.11/bin/kaitai-struct-compiler"
      - name: Build and validate installed package
        run: |
          mkdir -p "${RUNNER_TEMP}/suncet-wheel"
          python -m pip wheel --no-deps --wheel-dir "${RUNNER_TEMP}/suncet-wheel" .
          python -m pip install --no-deps --force-reinstall "${RUNNER_TEMP}"/suncet-wheel/*.whl
          cd "${RUNNER_TEMP}"
          python - <<'PY'
          from importlib.resources import files
          import json
          from suncet_processing_pipeline.satnogs.decoder import decode_public_beacon

          root = files("suncet_processing_pipeline")
          expected = (
              root / "config_files" / "config_default.ini",
              root / "config_files" / "cme_tracking_reference_v0.json",
              root / "satnogs" / "suncet_apid1.ksy",
              root / "satnogs" / "public_beacon_schema.csv",
          )
          assert all(path.is_file() for path in expected)
          data = root / "satnogs" / "test_data"
          packet = bytes.fromhex((data / "suncet_apid1_synthetic_252.hex").read_text())
          values = json.loads((data / "suncet_apid1_synthetic_252_expected.json").read_text())
          decoded = decode_public_beacon(packet)
          assert len(decoded) == len(values) == 111
          assert decoded["ccsds_apid"] == 1
          PY
      - name: Run Unit Tests
        run: python -m pytest -v
