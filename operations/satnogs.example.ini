[satnogs]
# Private NVMe archive; deliberately outside the public data/product tree.
directory = /srv/suncet/satnogs-private
required_mount = /srv/suncet
token_file = ~/.config/suncet/satnogs.token
initial_start = 2026-10-01T00:00:00Z
overlap_days = 7
reconcile_days = 30
min_free_gib = 150
max_pages = 1000

# Enable immediate private archival by adding this section to the host-local
# configuration. Actual bucket/account identifiers must never be committed.
# [archive]
# bucket = PRIVATE_RAW_ARCHIVE_BUCKET
# profile = suncet-ingest
# region = us-east-2
# prefix = satnogs/
# aws_cli = ~/.local/bin/aws
